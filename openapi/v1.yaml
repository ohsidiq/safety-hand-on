        "401":
          description: UNAUTHORIZED atau TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: ACCOUNT_DEACTIVATED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
