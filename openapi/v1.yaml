            - INACTIVE
        version:
          type: integer
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - name
        - code
        - description
        - status
        - version
        - created_at
        - updated_at
    EquipmentClassCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
        code:
          type: string
          pattern: ^[A-Z0-9][A-Z0-9-]{1,29}$
          description: Huruf besar, angka, tanda hubung; 2-30 karakter
          example: SITE-A
        description:
          type:
            - string
            - "null"
          maxLength: 1000
      required:
        - name
        - code
    EquipmentClassPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
        code:
          type: string
          pattern: ^[A-Z0-9][A-Z0-9-]{1,29}$
          description: Huruf besar, angka, tanda hubung; 2-30 karakter
          example: SITE-A
        description:
          type:
            - string
            - "null"
          maxLength: 1000
    TeamMember:
      type: object
      properties:
        worker_id:
          type: string
          format: uuid
        full_name:
          type:
            - string
            - "null"
          description: null bila pemanggil tidak memiliki worker.read atas pekerja
        sho_id:
          type:
            - string
            - "null"
        valid_from:
          type: string
        valid_until:
          type:
            - string
            - "null"
        active:
          type: boolean
      required:
        - worker_id
        - full_name
        - sho_id
        - valid_from
        - valid_until
        - active
    TeamMemberAdd:
      type: object
      properties:
        worker_id:
          type: string
          format: uuid
        valid_from:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
      required:
        - worker_id
        - valid_from
    TeamMemberEnd:
      type: object
      properties:
        valid_until:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
      required:
        - valid_until
    FileCreate:
      type: object
      properties:
        original_name:
          type: string
          minLength: 1
          maxLength: 200
        mime_type:
          type: string
          enum:
            - application/pdf
            - image/jpeg
            - image/png
            - image/webp
        size_bytes:
          type: integer
          exclusiveMinimum: 0
        purpose:
          type: string
          enum:
            - COMPETENCY_CERTIFICATE
            - AUTHORIZATION_DOCUMENT
            - SIMPER_DOCUMENT
            - MEDICAL_DOCUMENT
      required:
        - original_name
        - mime_type
        - size_bytes
        - purpose
    FileObject:
      type: object
      properties:
        id:
          type: string
          format: uuid
        original_name:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
        purpose:
          type: string
          enum:
            - COMPETENCY_CERTIFICATE
            - AUTHORIZATION_DOCUMENT
            - SIMPER_DOCUMENT
            - MEDICAL_DOCUMENT
        classification:
          type: string
          enum:
            - INTERNAL
            - CONFIDENTIAL
            - SENSITIVE
        scan_status:
          type: string
          enum:
            - PENDING
            - CLEAN
            - INFECTED
            - FAILED
        scan_detail:
          type:
            - string
            - "null"
        checksum_sha256:
          type:
            - string
            - "null"
        uploaded_at:
          type: string
        scanned_at:
          type:
            - string
            - "null"
      required:
        - id
        - original_name
        - mime_type
        - size_bytes
        - purpose
        - classification
        - scan_status
        - scan_detail
        - checksum_sha256
        - uploaded_at
        - scanned_at
    WorkerImportResult:
      type: object
      properties:
        id:
          type:
            - string
            - "null"
          format: uuid
          description: null untuk dry_run
        dry_run:
          type: boolean
        all_or_nothing:
          type: boolean
        status:
          type: string
          enum:
            - VALIDATED
            - COMPLETED
            - REJECTED
        total_rows:
          type: integer
        created:
          type: integer
          description: "Untuk dry_run: jumlah baris yang akan dibuat"
        failed:
          type: integer
        errors:
          type: array
          items:
            type: object
            properties:
              row:
                type: integer
              field:
                type: string
              code:
                type: string
            required:
              - row
              - code
        replayed:
          type: boolean
          description: true bila hasil diambil dari permintaan sebelumnya (Idempotency-Key)
      required:
        - id
        - dry_run
        - all_or_nothing
        - status
        - total_rows
        - created
        - failed
        - errors
        - replayed
    WorkerImportRequest:
      type: object
      properties:
        csv:
          type: string
          minLength: 1
          maxLength: 1000000
          description: Isi CSV UTF-8 sesuai templat (maks 1.000 baris data)
        dry_run:
          type: boolean
          default: true
        all_or_nothing:
