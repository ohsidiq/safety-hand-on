        code:
          type: string
          pattern: ^[A-Z0-9][A-Z0-9-]{1,29}$
          description: Huruf besar, angka, tanda hubung; 2-30 karakter
          example: SITE-A
    Team:
      type: object
      properties:
        id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
        department_id:
          type:
            - string
            - "null"
          format: uuid
        name:
          type: string
        code:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
        version:
          type: integer
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - site_id
        - department_id
        - name
        - code
        - status
        - version
        - created_at
        - updated_at
    TeamCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
        code:
          type: string
          pattern: ^[A-Z0-9][A-Z0-9-]{1,29}$
          description: Huruf besar, angka, tanda hubung; 2-30 karakter
          example: SITE-A
        department_id:
          type:
            - string
            - "null"
          format: uuid
      required:
        - name
        - code
    TeamPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
        code:
          type: string
          pattern: ^[A-Z0-9][A-Z0-9-]{1,29}$
          description: Huruf besar, angka, tanda hubung; 2-30 karakter
          example: SITE-A
    JobPosition:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
        job_family:
          type:
            - string
            - "null"
        description:
          type:
            - string
            - "null"
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
        version:
          type: integer
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - name
        - code
        - job_family
        - description
        - status
        - version
        - created_at
        - updated_at
    JobPositionCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
        code:
          type: string
          pattern: ^[A-Z0-9][A-Z0-9-]{1,29}$
          description: Huruf besar, angka, tanda hubung; 2-30 karakter
          example: SITE-A
        job_family:
          type:
            - string
            - "null"
          maxLength: 100
        description:
          type:
            - string
            - "null"
          maxLength: 1000
      required:
        - name
        - code
    JobPositionPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
        code:
          type: string
          pattern: ^[A-Z0-9][A-Z0-9-]{1,29}$
          description: Huruf besar, angka, tanda hubung; 2-30 karakter
          example: SITE-A
        job_family:
          type:
            - string
            - "null"
          maxLength: 100
        description:
          type:
            - string
            - "null"
          maxLength: 1000
    EquipmentClass:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
