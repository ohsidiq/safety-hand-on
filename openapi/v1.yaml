paths:
  /api/v1/health/live:
    get:
      tags:
        - Health
      summary: "Liveness: proses Core API berjalan"
      responses:
        "200":
          description: Proses hidup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/health/ready:
    get:
      tags:
        - Health
      summary: "Readiness: dependensi (database) siap"
      responses:
        "200":
          description: Siap melayani
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Belum siap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/auth/me:
    get:
      tags:
        - Auth
      summary: "Identitas pemanggil: profil, penugasan role aktif, permission efektif"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Identitas pengguna yang sedang login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: UNAUTHORIZED atau TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: ACCOUNT_DEACTIVATED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          description: ACCOUNT_LOCKED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Autentikasi atau database belum tersedia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/audit-logs:
    get:
      tags:
        - Audit
      summary: Daftar jejak audit organisasi (kursor, filter)
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            description: Awal rentang (ISO 8601, UTC). Wajib
            example: 2026-11-01T00:00:00Z
          required: false
          description: Awal rentang (ISO 8601, UTC). Wajib
          name: from
          in: query
        - schema:
            type: string
            description: Akhir rentang (ISO 8601, UTC). Wajib, maksimum 92 hari
          required: false
          description: Akhir rentang (ISO 8601, UTC). Wajib, maksimum 92 hari
          name: to
          in: query
        - schema:
            type: string
            format: uuid
          required: false
          name: actor_user_id
          in: query
        - schema:
            type: string
            maxLength: 500
            description: Satu atau beberapa kode aksi, dipisah koma
          required: false
          description: Satu atau beberapa kode aksi, dipisah koma
          name: action
          in: query
        - schema:
            type: string
            pattern: ^[a-z_]{1,64}$
          required: false
          name: entity_type
          in: query
        - schema:
            type: string
            format: uuid
          required: false
          name: entity_id
