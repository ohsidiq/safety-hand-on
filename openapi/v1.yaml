      tags:
        - Audit
      summary: Daftar jejak audit organisasi (kursor, filter)
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            description: Awal rentang (ISO 8601, UTC). Wajib
            example: 2026-11-01T00:00:00Z
          required: false
          description: Awal rentang (ISO 8601, UTC). Wajib
          name: from
          in: query
        - schema:
            type: string
            description: Akhir rentang (ISO 8601, UTC). Wajib, maksimum 92 hari
          required: false
          description: Akhir rentang (ISO 8601, UTC). Wajib, maksimum 92 hari
          name: to
          in: query
        - schema:
            type: string
            format: uuid
          required: false
          name: actor_user_id
          in: query
        - schema:
            type: string
            maxLength: 500
            description: Satu atau beberapa kode aksi, dipisah koma
          required: false
          description: Satu atau beberapa kode aksi, dipisah koma
          name: action
          in: query
        - schema:
            type: string
            pattern: ^[a-z_]{1,64}$
          required: false
          name: entity_type
          in: query
        - schema:
            type: string
            format: uuid
          required: false
          name: entity_id
          in: query
        - schema:
            type: string
            format: uuid
          required: false
          name: site_id
          in: query
        - schema:
            type: string
            enum:
              - SUCCESS
              - DENIED
              - FAILED
          required: false
          name: result
          in: query
        - schema:
            type: string
            enum:
              - "true"
              - "false"
          required: false
          name: sensitive_access
          in: query
        - schema:
            type: string
            enum:
              - USER
              - SYSTEM
              - SUPPORT
          required: false
          name: actor_kind
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
          required: false
          name: limit
          in: query
        - schema:
            type: string
            maxLength: 200
          required: false
          name: cursor
          in: query
      responses:
        "200":
          description: Daftar kejadian audit, terbaru lebih dulu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditListResponse"
        "400":
          description: DATE_RANGE_REQUIRED atau DATE_RANGE_TOO_LARGE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditErrorResponse"
        "401":
          description: UNAUTHORIZED atau TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditErrorResponse"
        "403":
          description: FORBIDDEN (tanpa audit.view) atau ACCOUNT_DEACTIVATED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditErrorResponse"
        "422":
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditErrorResponse"
