# Dibangkitkan oleh: pnpm --filter @soh/api openapi. Jangan diubah manual.
openapi: 3.1.0
info:
  title: Safety On Hand Core API
  version: 0.1.0
  description: Kontrak API v1 (ARCH-003). Data sintetis saja sampai syarat B-24 terpenuhi.
servers:
  - url: /
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token akses Supabase Auth
  schemas:
    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/HealthStatus"
        request_id:
          type: string
      required:
        - success
        - data
        - request_id
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum:
            - UP
            - DOWN
          example: UP
      required:
        - status
    MeResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          $ref: "#/components/schemas/Me"
        request_id:
          type: string
      required:
        - success
        - data
        - request_id
    Me:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        organization:
          type:
            - object
            - "null"
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            code:
              type:
                - string
                - "null"
          required:
            - id
            - name
            - code
        full_name:
          type:
            - string
            - "null"
        worker_id:
          type:
            - string
            - "null"
          format: uuid
        language:
          type: string
          enum:
            - id
            - en
        role_assignments:
          type: array
          items:
            $ref: "#/components/schemas/RoleAssignment"
        permissions:
          type: array
          items:
            type: string
          example:
            - worker.read
            - readiness.read
        limited_permissions:
          type: array
          items:
            type: string
          description: Permission tingkat LIMITED (mis. medical.update = pencatatan
            administratif)
          example:
            - medical.update
        self_permissions:
          type: array
          items:
            type: string
          description: Permission tingkat SELF (hanya atas data pekerja sendiri)
          example:
            - competency.update
        mfa_enabled:
          type: boolean
        must_change_credential:
          type: boolean
      required:
        - user_id
        - organization
        - full_name
        - worker_id
        - language
        - role_assignments
        - permissions
        - limited_permissions
        - self_permissions
        - mfa_enabled
        - must_change_credential
    RoleAssignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        role_code:
          type: string
          example: SUPERVISOR
        scope_type:
          type: string
          enum:
            - PLATFORM
            - ORGANIZATION
            - SITE
            - DEPARTMENT
            - TEAM
            - CONTRACTOR
            - SELF
        scope_id:
          type:
            - string
            - "null"
          format: uuid
        valid_until:
          type:
            - string
            - "null"
      required:
        - id
        - role_code
        - scope_type
        - scope_id
        - valid_until
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message
        request_id:
          type: string
      required:
        - success
        - error
        - request_id
    AuditListResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        pagination:
          type: object
          properties:
            limit:
              type: number
            next_cursor:
              type:
                - string
                - "null"
            has_more:
              type: boolean
          required:
            - limit
            - next_cursor
            - has_more
        request_id:
          type: string
      required:
        - success
        - data
        - pagination
        - request_id
    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        occurred_at:
          type: string
        actor_kind:
          type: string
          enum:
            - USER
            - SYSTEM
            - SUPPORT
        actor:
          type:
            - object
            - "null"
          properties:
            user_id:
              type: string
              format: uuid
            full_name:
              type:
                - string
                - "null"
            role_code:
              type:
                - string
                - "null"
            scope_type:
              type:
                - string
                - "null"
          required:
            - user_id
            - full_name
            - role_code
            - scope_type
        action:
          type: string
          example: access.role_assigned
        entity_type:
          type: string
        entity_id:
          type:
            - string
            - "null"
          format: uuid
        site_id:
          type:
            - string
            - "null"
          format: uuid
        changed_fields:
          type:
            - array
            - "null"
          items:
            type: string
        changes:
          type:
            - object
            - "null"
          additionalProperties: {}
        sensitive_access:
          type: boolean
        access_reason:
          type:
            - string
            - "null"
        result:
          type: string
          enum:
            - SUCCESS
            - DENIED
            - FAILED
        request_id:
          type:
            - string
            - "null"
        ip:
          type:
            - string
            - "null"
          description: Hanya untuk Company Admin dan Auditor
        user_agent:
          type:
            - string
            - "null"
          description: Hanya untuk Company Admin dan Auditor
      required:
        - id
        - occurred_at
        - actor_kind
        - actor
        - action
        - entity_type
        - entity_id
        - site_id
        - changed_fields
        - changes
        - sensitive_access
        - access_reason
        - result
        - request_id
    AuditErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message
        request_id:
          type: string
      required:
        - success
        - error
        - request_id
    DashboardSummaryResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: object
          properties:
            as_of:
              type: string
            scope:
              type: object
              properties:
                organization_id:
                  type:
                    - string
                    - "null"
                  format: uuid
              required:
                - organization_id
            administration:
              $ref: "#/components/schemas/DashboardAdministration"
          required:
            - as_of
            - scope
        request_id:
          type: string
      required:
        - success
        - data
        - request_id
    DashboardAdministration:
      type: object
      properties:
        users:
          type: object
          properties:
            active:
              type: integer
            invited:
              type: integer
              description: Undangan tertunda (status INVITED)
            locked:
              type: integer
            deactivated:
              type: integer
          required:
            - active
            - invited
            - locked
            - deactivated
        workers:
          type: object
          properties:
            total:
              type: integer
            with_account:
              type: integer
              description: Pekerja yang terhubung ke akun (B-18)
            missing_job_position:
              type: integer
              description: "Kelengkapan data: pekerja tanpa Job Position"
          required:
            - total
            - with_account
            - missing_job_position
      required:
        - users
        - workers
    DashboardErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message
        request_id:
          type: string
      required:
        - success
        - error
        - request_id
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        notification_type:
          type: string
          example: SYSTEM_ALERT
        category:
          type: string
          enum:
            - READINESS
            - EXPIRY
            - VERIFICATION
            - INSPECTION
            - OBSERVATION
            - CORRECTIVE_ACTION
            - TRAINING
            - AI
            - SYSTEM
        priority:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
            - CRITICAL
        title:
          type: string
        body:
          type: string
        link:
          type:
            - string
            - "null"
        entity:
          type:
            - object
            - "null"
          properties:
            type:
              type: string
            id:
              type: string
              format: uuid
          required:
            - type
            - id
        created_at:
          type: string
        read_at:
          type:
            - string
            - "null"
      required:
        - id
        - notification_type
        - category
        - priority
        - title
        - body
        - link
        - entity
        - created_at
        - read_at
    NotificationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message
        request_id:
          type: string
      required:
        - success
        - error
        - request_id
    WorkerCompetency:
      type: object
      properties:
        id:
          type: string
          format: uuid
        worker_id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
        worker_name:
          type:
            - string
            - "null"
          description: null bila pemanggil tidak dapat membaca data pekerja
        sho_id:
          type:
            - string
            - "null"
        competency:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type:
                - string
                - "null"
            code:
              type:
                - string
                - "null"
          required:
            - id
            - name
            - code
        valid_from:
          type: string
        valid_until:
          type:
            - string
            - "null"
        source:
          type: string
          enum:
            - CERTIFICATE
            - TRAINING
            - ASSESSMENT
            - OTHER
        verification_status:
          type: string
          enum:
            - PENDING
            - VERIFIED
            - REJECTED
        validity_status:
          type: string
          enum:
            - VALID
            - EXPIRING_SOON
            - EXPIRED
            - PENDING_VERIFICATION
            - REJECTED
        verified_by:
          type:
            - string
            - "null"
          format: uuid
        verified_by_name:
          type:
            - string
            - "null"
        verified_at:
          type:
            - string
            - "null"
        verification_comment:
          type:
            - string
            - "null"
        rejection_reason:
          type:
            - string
            - "null"
        created_by:
          type: string
          format: uuid
        created_by_name:
          type:
            - string
            - "null"
        created_at:
          type: string
        updated_at:
          type: string
        version:
          type: integer
        certificate_count:
          type: integer
        can_verify:
          type: boolean
          description: Pemanggil boleh memverifikasi (PENDING, bukan pembuat, punya
            competency.verify)
      required:
        - id
        - worker_id
        - site_id
        - worker_name
        - sho_id
        - competency
        - valid_from
        - valid_until
        - source
        - verification_status
        - validity_status
        - verified_by
        - verified_by_name
        - verified_at
        - verification_comment
        - rejection_reason
        - created_by
        - created_by_name
        - created_at
        - updated_at
        - version
        - certificate_count
        - can_verify
    ApiErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  issue:
                    type: string
                required:
                  - issue
          required:
            - code
            - message
        request_id:
          type: string
      required:
        - success
        - error
        - request_id
    WorkerCompetencyCreate:
      type: object
      properties:
        competency_id:
          type: string
          format: uuid
        valid_from:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        valid_until:
          type:
            - string
            - "null"
          pattern: ^\d{4}-\d{2}-\d{2}$
        source:
          type: string
          enum:
            - CERTIFICATE
            - TRAINING
            - ASSESSMENT
            - OTHER
          default: CERTIFICATE
        certificates:
          type: array
          items:
            $ref: "#/components/schemas/CompetencyCertificateCreate"
          maxItems: 5
          default: []
      required:
        - competency_id
        - valid_from
    CompetencyCertificateCreate:
      type: object
      properties:
        certificate_number:
          type:
            - string
            - "null"
          maxLength: 100
        issuer:
          type:
            - string
            - "null"
          maxLength: 150
        issue_date:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        expiry_date:
          type:
            - string
            - "null"
          pattern: ^\d{4}-\d{2}-\d{2}$
        file_id:
          type: string
          format: uuid
      required:
        - issue_date
        - file_id
    WorkerCompetencyPatch:
      type: object
      properties:
        valid_from:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        valid_until:
          type:
            - string
            - "null"
          pattern: ^\d{4}-\d{2}-\d{2}$
        source:
          type: string
          enum:
            - CERTIFICATE
            - TRAINING
            - ASSESSMENT
            - OTHER
    CompetencyVerify:
      type: object
      properties:
        comment:
          type: string
          maxLength: 500
    CompetencyReject:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
    CompetencyCertificate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        worker_competency_id:
          type: string
          format: uuid
        certificate_number:
          type:
            - string
            - "null"
        issuer:
          type:
            - string
            - "null"
        issue_date:
          type: string
        expiry_date:
          type:
            - string
            - "null"
        file_id:
          type:
            - string
            - "null"
          format: uuid
        file_name:
          type:
            - string
            - "null"
        created_at:
          type: string
      required:
        - id
        - worker_competency_id
        - certificate_number
        - issuer
        - issue_date
        - expiry_date
        - file_id
        - file_name
        - created_at
    WorkerAuthorization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        worker_id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
        worker_name:
          type:
            - string
            - "null"
        sho_id:
          type:
            - string
            - "null"
        authorization_type:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type:
                - string
                - "null"
            code:
              type:
                - string
                - "null"
            requires_work_scope:
              type:
                - boolean
                - "null"
          required:
            - id
            - name
            - code
            - requires_work_scope
        authorization_number:
          type:
            - string
            - "null"
        issuer:
          type:
            - string
            - "null"
        work_scope:
          type:
            - string
            - "null"
        restriction_note:
          type:
            - string
            - "null"
        valid_from:
          type: string
        valid_until:
          type:
            - string
            - "null"
        has_document:
          type: boolean
        verification_status:
          type: string
          enum:
            - PENDING
            - VERIFIED
            - REJECTED
        suspension_status:
          type: string
          enum:
            - NONE
            - SUSPENDED
            - REVOKED
        validity_status:
          type: string
          enum:
            - VALID
            - EXPIRING_SOON
            - EXPIRED
            - PENDING_VERIFICATION
            - REJECTED
            - SUSPENDED
        verified_by_name:
          type:
            - string
            - "null"
        verified_at:
          type:
            - string
            - "null"
        verification_comment:
          type:
            - string
            - "null"
        rejection_reason:
          type:
            - string
            - "null"
        suspended_by_name:
          type:
            - string
            - "null"
        suspended_at:
          type:
            - string
            - "null"
        suspension_reason:
          type:
            - string
            - "null"
        created_by:
          type: string
          format: uuid
        created_by_name:
          type:
            - string
            - "null"
        created_at:
          type: string
        updated_at:
          type: string
        version:
          type: integer
        can_verify:
          type: boolean
      required:
        - id
        - worker_id
        - site_id
        - worker_name
        - sho_id
        - authorization_type
        - authorization_number
        - issuer
        - work_scope
        - restriction_note
        - valid_from
        - valid_until
        - has_document
        - verification_status
        - suspension_status
        - validity_status
        - verified_by_name
        - verified_at
        - verification_comment
        - rejection_reason
        - suspended_by_name
        - suspended_at
        - suspension_reason
        - created_by
        - created_by_name
        - created_at
        - updated_at
        - version
        - can_verify
    WorkerAuthorizationCreate:
      type: object
      properties:
        authorization_type_id:
          type: string
          format: uuid
        valid_from:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        valid_until:
          type:
            - string
            - "null"
          pattern: ^\d{4}-\d{2}-\d{2}$
        authorization_number:
          type:
            - string
            - "null"
          maxLength: 100
        issuer:
          type:
            - string
            - "null"
          maxLength: 150
        work_scope:
          type:
            - string
            - "null"
          maxLength: 500
        restriction_note:
          type:
            - string
            - "null"
          maxLength: 500
        file_id:
          type:
            - string
            - "null"
          format: uuid
      required:
        - authorization_type_id
        - valid_from
    WorkerAuthorizationPatch:
      type: object
      properties:
        valid_from:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        valid_until:
          type:
            - string
            - "null"
          pattern: ^\d{4}-\d{2}-\d{2}$
        authorization_number:
          type:
            - string
            - "null"
          maxLength: 100
        issuer:
          type:
            - string
            - "null"
          maxLength: 150
        work_scope:
          type:
            - string
            - "null"
          maxLength: 500
        restriction_note:
          type:
            - string
            - "null"
          maxLength: 500
        file_id:
          type:
            - string
            - "null"
          format: uuid
    WorkerAuthorizationAction:
      type: object
      properties:
        comment:
          type: string
          maxLength: 500
        reason:
          type: string
          maxLength: 500
    Simper:
      type: object
      properties:
        id:
          type: string
          format: uuid
        worker_id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
        worker_name:
          type:
            - string
            - "null"
        sho_id:
          type:
            - string
            - "null"
        simper_type:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type:
                - string
                - "null"
            code:
              type:
                - string
                - "null"
          required:
            - id
            - name
            - code
        simper_number:
          type:
            - string
            - "null"
        issuer:
          type:
            - string
            - "null"
        restriction_note:
          type:
            - string
            - "null"
        valid_from:
          type: string
        valid_until:
          type:
            - string
            - "null"
        has_document:
          type: boolean
        verification_status:
          type: string
          enum:
            - PENDING
            - VERIFIED
            - REJECTED
        suspension_status:
          type: string
          enum:
            - NONE
            - SUSPENDED
            - REVOKED
        validity_status:
          type: string
          enum:
            - VALID
            - EXPIRING_SOON
            - EXPIRED
            - PENDING_VERIFICATION
            - REJECTED
            - SUSPENDED
        verified_by_name:
          type:
            - string
            - "null"
        verified_at:
          type:
            - string
            - "null"
        verification_comment:
          type:
            - string
            - "null"
        rejection_reason:
          type:
            - string
            - "null"
        suspended_by_name:
          type:
            - string
            - "null"
        suspended_at:
          type:
            - string
            - "null"
        suspension_reason:
          type:
            - string
            - "null"
        created_by:
          type: string
          format: uuid
        created_by_name:
          type:
            - string
            - "null"
        created_at:
          type: string
        updated_at:
          type: string
        version:
          type: integer
        can_verify:
          type: boolean
        equipment_authorizations:
          type: array
          items:
            $ref: "#/components/schemas/SimperAuthorization"
      required:
        - id
        - worker_id
        - site_id
        - worker_name
        - sho_id
        - simper_type
        - simper_number
        - issuer
        - restriction_note
        - valid_from
        - valid_until
        - has_document
        - verification_status
        - suspension_status
        - validity_status
        - verified_by_name
        - verified_at
        - verification_comment
        - rejection_reason
        - suspended_by_name
        - suspended_at
        - suspension_reason
        - created_by
        - created_by_name
        - created_at
        - updated_at
        - version
        - can_verify
        - equipment_authorizations
    SimperAuthorization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        simper_id:
          type: string
          format: uuid
        equipment_class:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type:
                - string
                - "null"
            code:
              type:
                - string
                - "null"
          required:
            - id
            - name
