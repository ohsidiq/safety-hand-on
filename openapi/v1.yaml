        "200":
          description: Siap melayani
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Belum siap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
