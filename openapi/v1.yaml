      summary: Penempatan baru (mutasi Site/department/posisi); menutup penempatan
        sebelumnya
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerAssignmentCreate"
      responses:
        "201":
          description: Pekerja dengan penempatan terbaru
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/Worker"
                  request_id:
                    type: string
                required:
                  - success
                  - data
                  - request_id
        "401":
          description: UNAUTHORIZED atau TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: FORBIDDEN, SCOPE_DENIED atau ACCOUNT_DEACTIVATED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: NOT_FOUND (tidak ada atau di luar organisasi/scope)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: DUPLICATE, INVALID_STATE_TRANSITION, ASSIGNMENT_OVERLAP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "412":
          description: VERSION_CONFLICT (disertai current_version)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "422":
          description: VALIDATION_ERROR, DEPARTMENT_NOT_IN_SITE, CONTRACTOR_REQUIRED,
            CONTRACTOR_NOT_ALLOWED, REASON_REQUIRED,
            SITE_NOT_LINKED_TO_CONTRACTOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: SERVICE_UNAVAILABLE (penyimpanan NIK belum dikonfigurasi)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/contractors:
    get:
      tags:
        - Contractors
      summary: Daftar kontraktor untuk pemilih (data induk P0, B-23). Pengelolaan
        penuh P2
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            enum:
              - ACTIVE
              - INACTIVE
          required: false
          name: status
          in: query
      responses:
        "200":
          description: Kontraktor
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ContractorOption"
                  pagination:
                    type: object
                    properties:
                      limit:
                        type: number
                      next_cursor:
                        type:
                          - string
                          - "null"
                      has_more:
                        type: boolean
                    required:
                      - limit
                      - next_cursor
                      - has_more
                  request_id:
                    type: string
                required:
                  - success
                  - data
                  - pagination
                  - request_id
        "401":
          description: UNAUTHORIZED atau TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: FORBIDDEN, SCOPE_DENIED atau ACCOUNT_DEACTIVATED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "422":
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/spike/push-test:
    post:
      tags:
        - Spike S-6
      summary: "SPIKE: kirim notifikasi uji ke langganan Web Push (sementara, nonaktif
        secara bawaan)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subscription:
                  $ref: "#/components/schemas/PushSubscription"
              required:
                - subscription
      responses:
        "202":
          description: Notifikasi uji dikirim ke layanan push
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      sent:
                        type: boolean
                    required:
                      - sent
                  request_id:
                    type: string
                required:
                  - success
                  - data
                  - request_id
        "404":
          description: Spike tidak aktif
        "422":
          description: Langganan tidak valid atau layanan push tidak diizinkan
        "429":
          description: Terlalu banyak permintaan
        "502":
          description: Layanan push menolak
webhooks: {}
