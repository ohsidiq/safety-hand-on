# Dibangkitkan oleh: pnpm --filter @soh/api openapi. Jangan diubah manual.
openapi: 3.1.0
info:
  title: Safety On Hand Core API
  version: 0.1.0
  description: Kontrak API v1 (ARCH-003). Data sintetis saja sampai syarat B-24 terpenuhi.
servers:
  - url: /
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token akses Supabase Auth
  schemas:
    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/HealthStatus"
        request_id:
          type: string
      required:
        - success
        - data
        - request_id
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum:
            - UP
            - DOWN
          example: UP
      required:
        - status
    MeResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          $ref: "#/components/schemas/Me"
        request_id:
          type: string
      required:
        - success
        - data
        - request_id
    Me:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        organization:
          type:
            - object
            - "null"
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            code:
              type:
                - string
                - "null"
          required:
            - id
            - name
            - code
        full_name:
          type:
            - string
            - "null"
        worker_id:
          type:
            - string
            - "null"
          format: uuid
        language:
          type: string
          enum:
            - id
            - en
        role_assignments:
          type: array
          items:
            $ref: "#/components/schemas/RoleAssignment"
        permissions:
          type: array
          items:
            type: string
          example:
            - worker.read
            - readiness.read
        mfa_enabled:
          type: boolean
        must_change_credential:
          type: boolean
      required:
        - user_id
        - organization
        - full_name
        - worker_id
        - language
        - role_assignments
        - permissions
        - mfa_enabled
        - must_change_credential
    RoleAssignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        role_code:
          type: string
          example: SUPERVISOR
        scope_type:
          type: string
          enum:
            - PLATFORM
            - ORGANIZATION
            - SITE
            - DEPARTMENT
            - TEAM
            - CONTRACTOR
            - SELF
        scope_id:
          type:
            - string
            - "null"
          format: uuid
        valid_until:
          type:
            - string
            - "null"
      required:
        - id
        - role_code
        - scope_type
        - scope_id
        - valid_until
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message
        request_id:
          type: string
      required:
        - success
        - error
        - request_id
    AuditListResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        pagination:
          type: object
          properties:
            limit:
              type: number
            next_cursor:
              type:
                - string
                - "null"
            has_more:
              type: boolean
          required:
            - limit
            - next_cursor
            - has_more
        request_id:
          type: string
      required:
        - success
        - data
        - pagination
        - request_id
    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        occurred_at:
          type: string
        actor_kind:
          type: string
          enum:
            - USER
            - SYSTEM
            - SUPPORT
        actor:
          type:
            - object
            - "null"
          properties:
            user_id:
              type: string
              format: uuid
            full_name:
              type:
                - string
                - "null"
            role_code:
              type:
                - string
                - "null"
            scope_type:
              type:
                - string
                - "null"
          required:
            - user_id
            - full_name
            - role_code
            - scope_type
        action:
          type: string
          example: access.role_assigned
        entity_type:
          type: string
        entity_id:
          type:
            - string
            - "null"
          format: uuid
        site_id:
          type:
            - string
            - "null"
          format: uuid
        changed_fields:
          type:
            - array
            - "null"
          items:
            type: string
        changes:
          type:
            - object
            - "null"
          additionalProperties: {}
        sensitive_access:
          type: boolean
        access_reason:
          type:
            - string
            - "null"
        result:
          type: string
          enum:
            - SUCCESS
            - DENIED
            - FAILED
        request_id:
          type:
            - string
            - "null"
        ip:
          type:
            - string
            - "null"
          description: Hanya untuk Company Admin dan Auditor
        user_agent:
          type:
            - string
            - "null"
          description: Hanya untuk Company Admin dan Auditor
      required:
        - id
        - occurred_at
        - actor_kind
        - actor
        - action
        - entity_type
        - entity_id
        - site_id
        - changed_fields
        - changes
        - sensitive_access
        - access_reason
        - result
        - request_id
    AuditErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message
        request_id:
          type: string
      required:
        - success
        - error
        - request_id
    DashboardSummaryResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: object
          properties:
            as_of:
              type: string
            scope:
              type: object
              properties:
                organization_id:
                  type:
                    - string
                    - "null"
                  format: uuid
              required:
                - organization_id
            administration:
              $ref: "#/components/schemas/DashboardAdministration"
          required:
            - as_of
            - scope
        request_id:
          type: string
      required:
        - success
        - data
        - request_id
    DashboardAdministration:
      type: object
      properties:
        users:
          type: object
          properties:
            active:
              type: integer
            invited:
              type: integer
              description: Undangan tertunda (status INVITED)
            locked:
              type: integer
            deactivated:
              type: integer
          required:
            - active
            - invited
            - locked
            - deactivated
        workers:
          type: object
          properties:
            total:
              type: integer
            with_account:
              type: integer
              description: Pekerja yang terhubung ke akun (B-18)
            missing_job_position:
              type: integer
              description: "Kelengkapan data: pekerja tanpa Job Position"
          required:
            - total
            - with_account
            - missing_job_position
      required:
        - users
        - workers
    DashboardErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message
        request_id:
          type: string
      required:
        - success
        - error
        - request_id
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        notification_type:
          type: string
          example: SYSTEM_ALERT
        category:
          type: string
          enum:
            - READINESS
            - EXPIRY
            - VERIFICATION
            - INSPECTION
            - OBSERVATION
            - CORRECTIVE_ACTION
            - TRAINING
            - AI
            - SYSTEM
        priority:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
            - CRITICAL
        title:
          type: string
        body:
          type: string
        link:
          type:
            - string
            - "null"
        entity:
          type:
            - object
            - "null"
          properties:
            type:
              type: string
            id:
              type: string
              format: uuid
          required:
            - type
            - id
        created_at:
          type: string
        read_at:
          type:
            - string
            - "null"
      required:
        - id
        - notification_type
        - category
        - priority
        - title
        - body
        - link
        - entity
        - created_at
        - read_at
    NotificationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message
        request_id:
          type: string
      required:
        - success
        - error
        - request_id
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type:
            - string
            - "null"
        default_timezone:
          type: string
        plan:
          type:
            - string
            - "null"
        status:
          type: string
        version:
          type: integer
        updated_at:
          type: string
      required:
        - id
        - name
        - code
        - default_timezone
        - plan
        - status
        - version
        - updated_at
    ApiErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  issue:
                    type: string
                required:
                  - issue
          required:
            - code
            - message
        request_id:
          type: string
      required:
        - success
        - error
        - request_id
    OrganizationPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
        default_timezone:
          type: string
          minLength: 1
          maxLength: 64
          description: Nama zona IANA
          example: Asia/Makassar
    Site:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
        location:
          type:
            - string
            - "null"
        timezone:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
        version:
          type: integer
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - name
        - code
        - location
        - timezone
        - status
        - version
        - created_at
        - updated_at
    SiteCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
        code:
          type: string
          pattern: ^[A-Z0-9][A-Z0-9-]{1,29}$
          description: Huruf besar, angka, tanda hubung; 2-30 karakter
          example: SITE-A
        location:
          type:
            - string
            - "null"
          maxLength: 200
        timezone:
          type: string
          minLength: 1
          maxLength: 64
          description: Nama zona IANA
          example: Asia/Makassar
      required:
        - name
        - code
    SitePatch:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
        code:
          type: string
          pattern: ^[A-Z0-9][A-Z0-9-]{1,29}$
          description: Huruf besar, angka, tanda hubung; 2-30 karakter
          example: SITE-A
        location:
          type:
            - string
            - "null"
          maxLength: 200
        timezone:
          type: string
          minLength: 1
          maxLength: 64
          description: Nama zona IANA
          example: Asia/Makassar
    Department:
      type: object
      properties:
        id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
        version:
          type: integer
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - site_id
        - name
        - code
        - status
        - version
        - created_at
        - updated_at
    DepartmentCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
        code:
          type: string
          pattern: ^[A-Z0-9][A-Z0-9-]{1,29}$
          description: Huruf besar, angka, tanda hubung; 2-30 karakter
          example: SITE-A
      required:
        - name
        - code
    DepartmentPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
        code:
          type: string
          pattern: ^[A-Z0-9][A-Z0-9-]{1,29}$
          description: Huruf besar, angka, tanda hubung; 2-30 karakter
          example: SITE-A
    Division:
      type: object
      properties:
        id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
        department_id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
        version:
          type: integer
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - site_id
        - department_id
        - name
        - code
        - status
        - version
        - created_at
        - updated_at
    DivisionCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
        code:
          type: string
          pattern: ^[A-Z0-9][A-Z0-9-]{1,29}$
          description: Huruf besar, angka, tanda hubung; 2-30 karakter
          example: SITE-A
      required:
        - name
        - code
    DivisionPatch:
      type: object
      properties:
        name:
          type: string
