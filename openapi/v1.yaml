# Dibangkitkan oleh: pnpm --filter @soh/api openapi. Jangan diubah manual.
openapi: 3.1.0
info:
  title: Safety On Hand Core API
  version: 0.1.0
  description: Kontrak API v1 (ARCH-003). Data sintetis saja sampai syarat B-24 terpenuhi.
servers:
  - url: /
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token akses Supabase Auth
  schemas:
    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/HealthStatus"
        request_id:
          type: string
      required:
        - success
        - data
        - request_id
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum:
            - UP
            - DOWN
          example: UP
      required:
        - status
    MeResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          $ref: "#/components/schemas/Me"
        request_id:
          type: string
      required:
        - success
        - data
        - request_id
    Me:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        organization:
          type:
            - object
            - "null"
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            code:
              type:
                - string
                - "null"
          required:
            - id
            - name
            - code
        full_name:
          type:
            - string
            - "null"
        worker_id:
          type:
            - string
            - "null"
          format: uuid
        language:
          type: string
          enum:
            - id
            - en
        role_assignments:
          type: array
          items:
            $ref: "#/components/schemas/RoleAssignment"
        permissions:
          type: array
          items:
            type: string
          example:
            - worker.read
            - readiness.read
        mfa_enabled:
          type: boolean
        must_change_credential:
          type: boolean
      required:
        - user_id
        - organization
        - full_name
        - worker_id
        - language
        - role_assignments
        - permissions
        - mfa_enabled
        - must_change_credential
    RoleAssignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        role_code:
          type: string
          example: SUPERVISOR
        scope_type:
          type: string
          enum:
            - PLATFORM
            - ORGANIZATION
            - SITE
            - DEPARTMENT
            - TEAM
            - CONTRACTOR
            - SELF
        scope_id:
          type:
            - string
            - "null"
          format: uuid
        valid_until:
          type:
            - string
            - "null"
      required:
        - id
        - role_code
        - scope_type
        - scope_id
        - valid_until
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message
        request_id:
          type: string
      required:
        - success
        - error
        - request_id
    PushSubscription:
      type: object
      properties:
        endpoint:
          type: string
          maxLength: 2048
          format: uri
        keys:
          type: object
          properties:
            p256dh:
              type: string
              minLength: 1
              maxLength: 256
            auth:
              type: string
              minLength: 1
              maxLength: 64
          required:
            - p256dh
            - auth
      required:
        - endpoint
        - keys
  parameters: {}
paths:
  /api/v1/health/live:
    get:
      tags:
        - Health
      summary: "Liveness: proses Core API berjalan"
      responses:
        "200":
          description: Proses hidup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/health/ready:
    get:
      tags:
        - Health
      summary: "Readiness: dependensi (database) siap"
      responses:
        "200":
          description: Siap melayani
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Belum siap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/auth/me:
    get:
      tags:
        - Auth
      summary: "Identitas pemanggil: profil, penugasan role aktif, permission efektif"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Identitas pengguna yang sedang login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: UNAUTHORIZED atau TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: ACCOUNT_DEACTIVATED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          description: ACCOUNT_LOCKED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Autentikasi atau database belum tersedia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/spike/push-test:
    post:
      tags:
        - Spike S-6
      summary: "SPIKE: kirim notifikasi uji ke langganan Web Push (sementara, nonaktif
        secara bawaan)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subscription:
                  $ref: "#/components/schemas/PushSubscription"
              required:
                - subscription
      responses:
        "202":
          description: Notifikasi uji dikirim ke layanan push
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      sent:
                        type: boolean
                    required:
                      - sent
                  request_id:
                    type: string
                required:
                  - success
                  - data
                  - request_id
        "404":
          description: Spike tidak aktif
        "422":
          description: Langganan tidak valid atau layanan push tidak diizinkan
        "429":
          description: Terlalu banyak permintaan
        "502":
          description: Layanan push menolak
webhooks: {}
