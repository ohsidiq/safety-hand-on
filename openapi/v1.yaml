# Dibangkitkan oleh: pnpm --filter @soh/api openapi. Jangan diubah manual.
openapi: 3.1.0
info:
  title: Safety On Hand Core API
  version: 0.1.0
  description: Kontrak API v1 (ARCH-003). Data sintetis saja sampai syarat B-24 terpenuhi.
servers:
  - url: /
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token akses Supabase Auth
  schemas:
    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/HealthStatus"
        request_id:
          type: string
      required:
        - success
        - data
        - request_id
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum:
            - UP
            - DOWN
          example: UP
      required:
        - status
    MeResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          $ref: "#/components/schemas/Me"
        request_id:
          type: string
      required:
        - success
        - data
        - request_id
    Me:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        organization:
          type:
            - object
            - "null"
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            code:
              type:
                - string
                - "null"
          required:
            - id
            - name
            - code
        full_name:
          type:
            - string
            - "null"
        worker_id:
          type:
            - string
            - "null"
          format: uuid
        language:
          type: string
          enum:
            - id
            - en
        role_assignments:
          type: array
          items:
            $ref: "#/components/schemas/RoleAssignment"
        permissions:
          type: array
          items:
            type: string
          example:
            - worker.read
            - readiness.read
        mfa_enabled:
          type: boolean
        must_change_credential:
          type: boolean
      required:
        - user_id
        - organization
        - full_name
        - worker_id
        - language
        - role_assignments
        - permissions
        - mfa_enabled
        - must_change_credential
    RoleAssignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        role_code:
          type: string
          example: SUPERVISOR
        scope_type:
          type: string
          enum:
            - PLATFORM
            - ORGANIZATION
            - SITE
            - DEPARTMENT
            - TEAM
            - CONTRACTOR
            - SELF
        scope_id:
          type:
            - string
            - "null"
          format: uuid
        valid_until:
          type:
            - string
            - "null"
      required:
        - id
        - role_code
        - scope_type
        - scope_id
        - valid_until
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message
        request_id:
          type: string
      required:
        - success
        - error
        - request_id
    AuditListResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        pagination:
          type: object
          properties:
            limit:
              type: number
            next_cursor:
              type:
                - string
                - "null"
            has_more:
              type: boolean
          required:
            - limit
            - next_cursor
            - has_more
        request_id:
          type: string
      required:
        - success
        - data
        - pagination
        - request_id
    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        occurred_at:
          type: string
        actor_kind:
          type: string
          enum:
            - USER
            - SYSTEM
            - SUPPORT
        actor:
          type:
            - object
            - "null"
          properties:
            user_id:
              type: string
              format: uuid
            full_name:
              type:
                - string
                - "null"
            role_code:
              type:
                - string
                - "null"
            scope_type:
              type:
                - string
                - "null"
          required:
            - user_id
            - full_name
            - role_code
            - scope_type
        action:
          type: string
          example: access.role_assigned
        entity_type:
          type: string
        entity_id:
          type:
            - string
            - "null"
          format: uuid
        site_id:
          type:
            - string
            - "null"
          format: uuid
        changed_fields:
          type:
            - array
            - "null"
          items:
            type: string
        changes:
          type:
            - object
            - "null"
          additionalProperties: {}
        sensitive_access:
          type: boolean
        access_reason:
          type:
            - string
            - "null"
        result:
          type: string
          enum:
            - SUCCESS
            - DENIED
            - FAILED
        request_id:
          type:
            - string
            - "null"
        ip:
          type:
            - string
            - "null"
          description: Hanya untuk Company Admin dan Auditor
        user_agent:
          type:
            - string
            - "null"
          description: Hanya untuk Company Admin dan Auditor
      required:
        - id
        - occurred_at
        - actor_kind
        - actor
        - action
        - entity_type
        - entity_id
        - site_id
        - changed_fields
        - changes
        - sensitive_access
        - access_reason
        - result
        - request_id
    AuditErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message
        request_id:
          type: string
      required:
        - success
        - error
        - request_id
    PushSubscription:
      type: object
      properties:
        endpoint:
          type: string
          maxLength: 2048
          format: uri
        keys:
          type: object
          properties:
            p256dh:
              type: string
              minLength: 1
              maxLength: 256
            auth:
              type: string
              minLength: 1
              maxLength: 64
          required:
            - p256dh
            - auth
      required:
        - endpoint
        - keys
  parameters: {}
paths:
  /api/v1/health/live:
    get:
      tags:
        - Health
      summary: "Liveness: proses Core API berjalan"
      responses:
        "200":
          description: Proses hidup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/health/ready:
    get:
      tags:
        - Health
      summary: "Readiness: dependensi (database) siap"
      responses:
        "200":
          description: Siap melayani
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Belum siap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/auth/me:
    get:
      tags:
        - Auth
      summary: "Identitas pemanggil: profil, penugasan role aktif, permission efektif"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Identitas pengguna yang sedang login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: UNAUTHORIZED atau TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: ACCOUNT_DEACTIVATED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          description: ACCOUNT_LOCKED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Autentikasi atau database belum tersedia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/audit-logs:
    get:
      tags:
        - Audit
      summary: Daftar jejak audit organisasi (kursor, filter)
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            description: Awal rentang (ISO 8601, UTC). Wajib
            example: 2026-11-01T00:00:00Z
          required: false
          description: Awal rentang (ISO 8601, UTC). Wajib
          name: from
          in: query
        - schema:
            type: string
            description: Akhir rentang (ISO 8601, UTC). Wajib, maksimum 92 hari
          required: false
          description: Akhir rentang (ISO 8601, UTC). Wajib, maksimum 92 hari
          name: to
          in: query
        - schema:
            type: string
            format: uuid
          required: false
          name: actor_user_id
          in: query
        - schema:
            type: string
            maxLength: 500
            description: Satu atau beberapa kode aksi, dipisah koma
          required: false
          description: Satu atau beberapa kode aksi, dipisah koma
          name: action
          in: query
        - schema:
            type: string
            pattern: ^[a-z_]{1,64}$
          required: false
          name: entity_type
          in: query
        - schema:
            type: string
            format: uuid
          required: false
          name: entity_id
          in: query
        - schema:
            type: string
            format: uuid
          required: false
          name: site_id
          in: query
        - schema:
            type: string
            enum:
              - SUCCESS
              - DENIED
              - FAILED
          required: false
          name: result
          in: query
        - schema:
            type: string
            enum:
              - "true"
              - "false"
          required: false
          name: sensitive_access
          in: query
        - schema:
            type: string
            enum:
              - USER
              - SYSTEM
              - SUPPORT
          required: false
          name: actor_kind
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
          required: false
          name: limit
          in: query
        - schema:
            type: string
            maxLength: 200
          required: false
          name: cursor
          in: query
      responses:
        "200":
          description: Daftar kejadian audit, terbaru lebih dulu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditListResponse"
        "400":
          description: DATE_RANGE_REQUIRED atau DATE_RANGE_TOO_LARGE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditErrorResponse"
        "401":
          description: UNAUTHORIZED atau TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditErrorResponse"
        "403":
          description: FORBIDDEN (tanpa audit.view) atau ACCOUNT_DEACTIVATED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditErrorResponse"
        "422":
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditErrorResponse"
  /api/v1/audit-logs/{id}:
    get:
      tags:
        - Audit
      summary: Detail satu kejadian audit
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Kejadian audit
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/AuditEvent"
                  request_id:
                    type: string
                required:
                  - success
                  - data
                  - request_id
        "401":
          description: UNAUTHORIZED atau TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditErrorResponse"
        "403":
          description: FORBIDDEN (tanpa audit.view) atau ACCOUNT_DEACTIVATED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditErrorResponse"
        "404":
          description: NOT_FOUND (tidak ada atau milik organisasi lain)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditErrorResponse"
        "422":
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditErrorResponse"
  /api/v1/spike/push-test:
    post:
      tags:
        - Spike S-6
      summary: "SPIKE: kirim notifikasi uji ke langganan Web Push (sementara, nonaktif
        secara bawaan)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subscription:
                  $ref: "#/components/schemas/PushSubscription"
              required:
                - subscription
      responses:
        "202":
          description: Notifikasi uji dikirim ke layanan push
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      sent:
                        type: boolean
                    required:
                      - sent
                  request_id:
                    type: string
                required:
                  - success
                  - data
                  - request_id
        "404":
          description: Spike tidak aktif
        "422":
          description: Langganan tidak valid atau layanan push tidak diizinkan
        "429":
          description: Terlalu banyak permintaan
        "502":
          description: Layanan push menolak
webhooks: {}
